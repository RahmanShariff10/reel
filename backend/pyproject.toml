[project]
name = "reel"
version = "0.1.0"
description = "Automatic highlight reels from full T20 cricket broadcasts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.10,<1",
    "open-clip-torch>=2.24,<4",
    "panns-inference>=0.1,<0.2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0,<7",
    "rapidocr-onnxruntime>=1.4,<2",
    "scenedetect>=0.6,<0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
